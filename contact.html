<link rel="stylesheet" href="styles.css?v=14">
<script>
document.addEventListener("error", function (event) {
  var el = event.target;
  if (!el || el.tagName !== "IMG") return;
  var original = el.getAttribute("data-orig") || el.getAttribute("src") || "";
  if (!el.getAttribute("data-orig")) el.setAttribute("data-orig", original);
  var file = original.split("/").pop();
  var n = Number(el.getAttribute("data-retry") || "0");
  var next = [file, "assets/" + file, "The Skyward Project/assets/" + file];
  if (n >= next.length) return;
  el.setAttribute("data-retry", String(n + 1));
  el.src = next[n];
}, true);
</script>
</head>

<main id="main">
  <header class="page-head wrap" data-reveal>
    <p class="kicker">Contact</p>
    <h1>Write to us. We read everything.</h1>
    <span class="rules" aria-hidden="true"></span>
  </header>

  <div class="wrap">
    <form class="form" data-reveal action="https://api.web3forms.com/submit" method="POST" data-contact-form>
      <input type="hidden" name="access_key" value="d38558e6-c576-4688-b65d-367953ec1fc9">
      <input type="hidden" name="subject" value="New message from Skyward Project website">
      <input type="hidden" name="from_name" value="The Skyward Project website">
      <input type="checkbox" name="botcheck" class="honeypot" tabindex="-1" aria-hidden="true">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="organisation">Organisation <span class="optional">(optional)</span></label>
        <input type="text" id="organisation" name="organisation" autocomplete="organization">
      </div>
      <div class="field">
        <label for="enquiry_type">Subject</label>
        <select id="enquiry_type" name="enquiry_type" required>
          <option value="General enquiry">General enquiry</option>
          <option value="Partnership or pilot site">Partnership or pilot site</option>
          <option value="Media">Media</option>
          <option value="Write for Dispatches">Write for Dispatches</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="7" required></textarea>
      </div>
      <button class="button" type="submit">Send</button>
      <p class="form__status" data-form-status role="status" aria-live="polite"></p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer__row">
    <p>The Skyward Project · Pune &amp; Mumbai</p>
    <a href="contact.html">Contact</a>
  </div>
</footer>
